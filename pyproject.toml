[project]
name = "durable-agent-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.77",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.4.8",
    "temporalio[strands-agents]>=1.31.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dos = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
