id: invoice-exception
name: Invoice Exception
version: 4

# Tier 2 — SOP plus custom activity tools.
tier: "2"

model: bedrock-claude

tools:
  - issue_payment
  # v4 (E7.4 T1): a real Strands Swarm handoff (reviewer -> fraud specialist),
  # run entirely inside one Activity — see app/activities/swarm.py and
  # docs/DECISIONS.md for why it can't run as workflow code.
  - investigate_fraud_swarm

# v3 (E7.1 T1): vendor risk lookup via AgentCore Gateway/MCP, re-listed every
# turn. "vendor-directory" is a catalog key, not the Gateway's raw AWS URL —
# see app/registry/mcp_servers.py.
mcp_servers:
  - vendor-directory

parameters:
  escalation_threshold_usd: "200"

# v2 (E6.1 T4): same policy as v1, but the answer is a validated
# InvoiceDecision object instead of free text — proof 2's visible difference
# between a v1 session (still running, still free text) and a v2 session
# (started after the deploy, structured). See app/registry/output_models.py.
output_model: InvoiceDecision

# Payments above the threshold pause for a human reviewer. This is the tool call
# stage beat 3 kills the worker on, so it must stay idempotent.
approval_policy:
  tool: issue_payment
  field: amount_usd
  operator: gt
  value: 200
