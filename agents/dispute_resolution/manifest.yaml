id: dispute-resolution
name: Dispute Resolution
# v3 (E8.1 T2): the SOP now quotes the cardholder's statement verbatim rather
# than summarising it. Real chargeback practice — a filing is evidentiary and a
# paraphrase weakens it — and it is also what makes the Bedrock Guardrail
# demonstrable: with a summary, nothing the cardholder said ever reaches the
# guarded tool, so the gate has only the agent's own measured prose to judge
# and never fires. See docs/DECISIONS.md.
version: 3

# Tier 2 — SOP plus custom activity tools: two read-only lookups and one
# consequential filing.
tier: "2"

model: bedrock-claude

tools:
  - fetch_dispute_evidence
  - analyze_dispute_risk
  - submit_dispute_response

mcp_servers: []

parameters:
  # Contesting is only worth the fee below this; above it a human decides.
  review_threshold_usd: "500"
  repeat_claim_limit: "2"

# Filing a response on a high-value chargeback pauses for a human reviewer.
# Same declarative shape as invoice-exception's payment gate.
approval_policy:
  tool: submit_dispute_response
  field: amount_usd
  operator: gt
  value: 500
